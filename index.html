<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="shared/css/site.css">
    <link rel="stylesheet" href="pages/portfolio/portfolio.css">
</head>
<body>

    <div class="topstrip">
        <header>
            <h1>
                <a href="index.html">
                    Eloise Park
                </a>
            </h1>
        </header>
        <div id="icons">
            <a href="https://www.instagram.com/eloise_park_art/" target="_blank"><img src="assets/img/icons/insta.png" alt="Instagram"></a>
            <a href="contact.html"><img src="assets/img/icons/mail.png" alt="Email"></a>
            <a href="https://www.linkedin.com/in/eloise-park-a0b113347/" target="_blank"><img src="assets/img/icons/linkedin.png" alt="Linkedin"></a>
        </div>
    </div>


    <nav>
        <ul>
            <li><a href="index.html" class="active">Portfolio</a></li>
            <li><a href="resources.html">Educational Materials</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>

        <!-- Portfolio grid section -->
        <section>
            <!-- Tiles are generated by pages/portfolio/portfolio.js from artworks.js -->
            <div id="portfolio-grid" class="portfolio-grid"></div>
        </section>

        <!-- Project detail view (filled in by ProjectView.js) -->
        <section id="project-view" class="project-view hidden">
            <div class="project-nav-top">
            <button id="back-to-grid" class="nav-arrow">&#8592; Back</button>
            </div>

            <div class="project-content">
            <button id="prev-project" class="nav-arrow">&#8592;</button>

            <div class="project-details">
                <h2 id="project-title"></h2>
                <div class="project-image-wrapper">
                    <div class="watermark-overlay"></div>
                    <img id="project-image" src="" alt="">
                </div>
                <p id="project-description"></p>
            </div>

            <button id="next-project" class="nav-arrow">&#8594;</button>
            </div>
        </section>



    </main>
    <footer>
        All works &copy; 2026 Eloise Park unless otherwise noted 
        | <a href="https://www.instagram.com/eloise_park_art/" target="_blank">Instagram</a>

        | <a href="https://www.linkedin.com/in/eloise-park-a0b113347/" target="_blank">LinkedIn</a>
    </footer>

    <script src="shared/js/protect-images.js"></script>
